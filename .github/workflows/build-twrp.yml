name: Build TWRP Recovery - OPPO F3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Ubuntu + Java
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 libssl-dev ccache lzop imagemagick bc openjdk-8-jdk
        
    - name: Verify Java
      run: |
        java -version 2>&1 || true
        javac -version 2>&1 || true
        export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        
    - name: Install repo
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH
        
    - name: Download TWRP Source
      run: |
        mkdir -p ~/android/twrp
        cd ~/android/twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-7.1
        repo sync -c --force-sync --no-tags -j$(nproc) || repo sync -c --force-sync --no-tags -j2 || repo sync -c --force-sync --no-tags
        
    - name: Clone Device Tree
      run: |
        cd ~/android/twrp
        git clone https://github.com/yoda24/device-tree-cph1609_android_7.1.1_for_twrp_omni_7.1.git temp_device_tree
        mkdir -p device/oppo/CPH1609
        cp -r temp_device_tree/device/oppo/CPH1609/* device/oppo/CPH1609/
        rm -rf temp_device_tree
        echo "=== Device tree files ==="
        ls -la device/oppo/CPH1609/
        
    - name: Check Device Config
      run: |
        cd ~/android/twrp
        echo "=== AndroidProducts.mk ==="
        cat device/oppo/CPH1609/AndroidProducts.mk
        echo ""
        echo "=== vendorsetup.sh ==="
        cat device/oppo/CPH1609/vendorsetup.sh 2>/dev/null || echo "No vendorsetup.sh"
        echo ""
        echo "=== omni_CPH1609.mk ==="
        cat device/oppo/CPH1609/omni_CPH1609.mk 2>/dev/null || echo "No omni_CPH1609.mk"
        echo ""
        echo "=== BoardConfig.mk ==="
        cat device/oppo/CPH1609/BoardConfig.mk 2>/dev/null || echo "No BoardConfig.mk"
        
    - name: Fix SELinux
      run: |
        cd ~/android/twrp/device/oppo/CPH1609
        sed -i 's/SELINUX_IGNORE_NEVERALLOWS := true/SELINUX_IGNORE_NEVERALLOWS := false/g' BoardConfig.mk 2>/dev/null || true
        
    - name: Build TWRP
      run: |
        set -x
        cd ~/android/twrp
        export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        export LC_ALL=C
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        
        echo "=== Java version ==="
        java -version 2>&1
        
        echo "=== Sourcing build/envsetup.sh ==="
        source build/envsetup.sh
        echo "envsetup.sh sourced OK"
        
        echo "=== Running lunch ==="
        lunch omni_CPH1609-eng
        echo "lunch OK"
        
        echo "=== Starting build ==="
        make recoveryimage -j$(nproc) 2>&1 | tee build.log
        
    - name: Check Build Result
      if: always()
      run: |
        cd ~/android/twrp
        if [ -f "out/target/product/CPH1609/recovery.img" ]; then
          echo "BUILD SUCCESSFUL!"
          ls -lh out/target/product/CPH1609/recovery.img
          mkdir -p ${{ github.workspace }}/output
          cp out/target/product/CPH1609/recovery.img ${{ github.workspace }}/output/twrp_CPH1609.img
        else
          echo "BUILD FAILED!"
          echo "=== Last 300 lines of build.log ==="
          tail -300 build.log 2>/dev/null || echo "No build.log"
          echo ""
          echo "=== out directory ==="
          ls -la out/target/product/ 2>/dev/null || echo "No out/target/product"
          echo ""
          echo "=== out/target/product/CPH1609 ==="
          ls -la out/target/product/CPH1609/ 2>/dev/null || echo "No CPH1609 dir"
          exit 1
        fi
        
    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: twrp-CPH1609
        path: output/twrp_CPH1609.img
        
    - name: Create Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: twrp-build-${{ github.run_number }}
        name: TWRP for OPPO F3 (CPH1609)
        body: |
          ## TWRP Recovery for OPPO F3
          
          **Device:** OPPO F3 (CPH1609)
          **Chipset:** MediaTek MT6750
          **Build:** ${{ github.run_number }}
          
          ### Flash Instructions
          ```bash
          adb reboot bootloader
          fastboot flash recovery twrp_CPH1609.img
          fastboot boot twrp_CPH1609.img
          ```
          
          ### Features
          - Touch working
          - ADB/MTP working
          - Backup/Restore
          - Flash ZIP files
        files: output/twrp_CPH1609.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
