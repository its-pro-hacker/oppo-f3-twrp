name: Get TWRP Recovery - OPPO F3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Download pre-built TWRP from yoda24
      run: |
        curl -L -o recovery.img https://github.com/yoda24/device-tree-cph1609_android_7.1.1_for_twrp_omni_7.1/releases/download/test-1/recovery.img
        curl -L -o boot.img https://github.com/yoda24/device-tree-cph1609_android_7.1.1_for_twrp_omni_7.1/releases/download/test-1/boot.img
        echo "=== Downloaded files ==="
        ls -lh recovery.img boot.img

    - name: Validate recovery.img
      run: |
        echo "=== File info ==="
        file recovery.img
        echo "=== Size check ==="
        SIZE=$(stat -c%s recovery.img)
        echo "Size: $SIZE bytes"
        if [ "$SIZE" -lt 1048576 ]; then
          echo "ERROR: recovery.img too small!"
          exit 1
        fi
        echo "recovery.img is valid ($SIZE bytes)"

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: twrp-recovery-CPH1609
        path: |
          recovery.img
          boot.img

    - name: Create Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: twrp-${{ github.run_number }}
        name: TWRP for OPPO F3 (CPH1609)
        draft: false
        prerelease: false
        body: |
          ## TWRP Recovery for OPPO F3
          
          **Device:** OPPO F3 (CPH1609)
          **Chipset:** MediaTek MT6750
          **TWRP Version:** 3.7.0_9-0
          **Android:** 7.1.1
          **Source:** [yoda24 device tree](https://github.com/yoda24/device-tree-cph1609_android_7.1.1_for_twrp_omni_7.1)
          
          ### Files
          - `recovery.img` - TWRP Recovery image
          - `boot.img` - Boot image (prevents data re-encryption)
          
          ### Flash Instructions
          
          **Using fastboot:**
          ```bash
          adb reboot bootloader
          fastboot flash recovery recovery.img
          fastboot boot recovery.img
          ```
          
          **Using MTKClient:**
          ```bash
          python3 mtk w recovery recovery.img
          ```
          
          ### First Boot Notes
          1. Flash recovery.img using fastboot or MTKClient
          2. Also flash boot.img to prevent /data re-encryption
          3. Boot to TWRP: Power off, hold Vol Up + Power
          4. Go to **Wipe** -> **Format Data** -> type `yes` (erases internal storage but fixes /data mount)
          
          ### Features
          - Touch working
          - ADB/MTP working
          - Backup & Restore
          - Flash ZIP files
          - System, Data, Cache mount
        files: |
          recovery.img
          boot.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
