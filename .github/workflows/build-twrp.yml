name: Build TWRP Recovery - OPPO F3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Ubuntu
      run: |
        sudo apt-get update || true
        sudo apt-get install -y git gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 libssl-dev ccache || true
        
    - name: Install repo
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH
        
    - name: Download TWRP Source
      run: |
        mkdir -p ~/android/twrp
        cd ~/android/twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-7.1
        repo sync -c --force-sync --no-tags -j4 || repo sync -c --force-sync --no-tags -j2 || repo sync -c --force-sync --no-tags
        
    - name: Clone Device Tree
      run: |
        cd ~/android/twrp
        git clone https://github.com/yoda24/device-tree-cph1609_android_7.1.1_for_twrp_omni_7.1.git device/oppo/CPH1609
        
    - name: Fix SELinux
      run: |
        cd ~/android/twrp/device/oppo/CPH1609
        sed -i 's/SELINUX_IGNORE_NEVERALLOWS := true/SELINUX_IGNORE_NEVERALLOWS := false/g' BoardConfig.mk 2>/dev/null || true
        
    - name: Build TWRP
      run: |
        cd ~/android/twrp
        export LC_ALL=C
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        source build/envsetup.sh
        lunch omni_CPH1609-eng
        make recoveryimage -j4 2>&1 | tee build.log || make recoveryimage -j2 2>&1 | tee build.log || make recoveryimage 2>&1 | tee build.log
        
    - name: Check Build Result
      run: |
        cd ~/android/twrp
        if [ -f "out/target/product/CPH1609/recovery.img" ]; then
          echo "✅ Build Successful!"
          ls -lh out/target/product/CPH1609/recovery.img
          mkdir -p ${{ github.workspace }}/output
          cp out/target/product/CPH1609/recovery.img ${{ github.workspace }}/output/twrp_CPH1609.img
        else
          echo "❌ Build Failed!"
          tail -100 build.log
          exit 1
        fi
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: twrp-CPH1609
        path: output/twrp_CPH1609.img
        
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: twrp-build-${{ github.run_number }}
        name: TWRP for OPPO F3 (CPH1609)
        body: |
          ## TWRP Recovery for OPPO F3
          
          **Device:** OPPO F3 (CPH1609)
          **Chipset:** MediaTek MT6750
          **Build:** ${{ github.run_number }}
          
          ### Flash Instructions
          ```bash
          adb reboot bootloader
          fastboot flash recovery twrp_CPH1609.img
          fastboot boot twrp_CPH1609.img
          ```
          
          ### Features
          - Touch working
          - ADB/MTP working
          - Backup/Restore
          - Flash ZIP files
        files: output/twrp_CPH1609.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
