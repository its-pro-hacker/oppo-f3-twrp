name: Build TWRP Recovery - OPPO F3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Clone Device Tree (correct structure)
      run: |
        git clone https://github.com/yoda24/device-tree-cph1609_android_7.1.1_for_twrp_omni_7.1.git temp_tree
        mkdir -p device/oppo/CPH1609
        cp -r temp_tree/device/oppo/CPH1609/* device/oppo/CPH1609/
        rm -rf temp_tree
        echo "=== Device tree ==="
        ls -la device/oppo/CPH1609/

    - name: Build TWRP
      uses: mlm-games/TWRP-recovery-build-action@main
      with:
        MANIFEST_BRANCH: 'twrp-7.1'
        DEVICE_TREE: 'https://github.com/its-pro-hacker/oppo-f3-twrp.git'
        DEVICE_TREE_BRANCH: 'main'
        DEVICE_NAME: 'CPH1609'
        DEVICE_PATH: 'device/oppo/CPH1609'
        MAKEFILE_NAME: 'omni_CPH1609'
        BUILD_TARGET: 'recovery'

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: twrp-CPH1609
        path: ${{ env.OUTPUT_DIR }}/*.img

    - name: Create Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: twrp-build-${{ github.run_number }}
        name: TWRP for OPPO F3 (CPH1609)
        body: |
          ## TWRP Recovery for OPPO F3
          
          **Device:** OPPO F3 (CPH1609)
          **Chipset:** MediaTek MT6750
          **Build:** ${{ github.run_number }}
          
          ### Flash Instructions
          ```bash
          adb reboot bootloader
          fastboot flash recovery twrp_CPH1609.img
          fastboot boot twrp_CPH1609.img
          ```
          
          ### Features
          - Touch working
          - ADB/MTP working
          - Backup/Restore
          - Flash ZIP files
        files: ${{ env.OUTPUT_DIR }}/*.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
